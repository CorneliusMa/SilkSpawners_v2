CONFIG_MESSAGES_PREFIX = O prefixo do plugin usado em todas as mensagens
CONFIG_MESSAGES_LOCALE = O arquivo de idioma a ser usado
CONFIG_SPAWNER_DROPCHANCE = Probabilidade em porcentagem (0-100) de o spawner cair ao ser minerado
CONFIG_SPAWNER_DESTROYABLE = Se definido como false, spawners não podem ser destruídos sem SilkTouch ou sem a permissão
CONFIG_SPAWNER_PICKAXEREQUIRED = Se definido como false, spawners sempre cairão independentemente do item usado para minerá-los
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Se definido como false, spawners cairão mesmo se a picareta usada não tiver SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = O nível mínimo de SilkTouch que a picareta precisa para minerar spawners, no mínimo 1
CONFIG_SPAWNER_ITEM_NAME = O nome do item de spawner obtido, {entity} é substituído pelo nome do mob
CONFIG_SPAWNER_ITEM_COLOR = A cor do nome do mob nas mensagens do chat
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Se definido como true, uma mensagem é enviada ao jogador se o spawner não puder ser destruído
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Se definido como true, uma mensagem é enviada ao jogador se o spawner não puder ser colocado
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Se definido como true, uma mensagem é enviada ao jogador se o spawner não puder ser alterado
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Se definido como true, nenhuma permissão é necessária para receber spawners destruídos
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Se definido como true, nenhuma permissão é necessária para colocar spawners
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Se definido como true, nenhuma permissão é necessária para alterar spawners com ovos
CONFIG_UPDATE_CHECK_ENABLED = Se definido como true, o plugin verifica atualizações
CONFIG_UPDATE_CHECK_INTERVAL = O intervalo em horas para verificar atualizações, no mínimo 1
CONFIG_HOOKS_SHOPGUIPLUS = Se definido como true, SilkSpawners se integra ao ShopGUI+ se estiver instalado

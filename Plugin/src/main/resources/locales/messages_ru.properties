CONFIG_SPAWNER_SILKTOUCHREQUIRED = Если установлено в false, спавнеры будут выпадать, даже если используемая кирка не имеет SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = Минимальный уровень SilkTouch, необходимый кирке для добычи спавнеров, минимум 1
CONFIG_SPAWNER_ITEM_NAME = Название предмета спавнера, {entity} заменяется названием моба
CONFIG_SPAWNER_ITEM_COLOR = Цвет названия моба в сообщениях чата
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Если установлено в true, игроку отправляется сообщение, если спавнер нельзя уничтожить
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Если установлено в true, игроку отправляется сообщение, если спавнер нельзя поставить
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Если установлено в true, игроку отправляется сообщение, если спавнер нельзя изменить
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Если установлено в true, разрешение для получения уничтоженных спавнеров не требуется
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Если установлено в true, разрешение для установки спавнеров не требуется
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Если установлено в true, разрешение для изменения спавнеров яйцами не требуется
CONFIG_UPDATE_CHECK_ENABLED = Если установлено в true, плагин проверяет наличие обновлений
CONFIG_UPDATE_CHECK_INTERVAL = Интервал в часах для проверки обновлений, минимум 1

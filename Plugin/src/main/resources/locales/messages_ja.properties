CONFIG_MESSAGES_PREFIX = すべてのメッセージで使用されるプラグインのプレフィックス
CONFIG_MESSAGES_LOCALE = 使用する言語ファイル
CONFIG_SPAWNER_DROPCHANCE = 採掘時にスポナーがドロップする確率（パーセント、0～100）
CONFIG_SPAWNER_DESTROYABLE = false に設定すると、SilkTouch または権限がない限りスポナーを破壊できなくなります
CONFIG_SPAWNER_PICKAXEREQUIRED = false に設定すると、採掘に使用するアイテムに関係なくスポナーは常にドロップします
CONFIG_SPAWNER_SILKTOUCHREQUIRED = false に設定すると、使用したツルハシに SilkTouch が付いていなくてもスポナーがドロップします
CONFIG_SPAWNER_SILKTOUCHLEVEL = スポナーの採掘に必要な最低 SilkTouch レベル、最小1
CONFIG_SPAWNER_ITEM_NAME = ドロップするスポナーアイテムの名前、{entity} はモブ名に置き換えられます
CONFIG_SPAWNER_ITEM_COLOR = チャットメッセージ内のモブ名の色
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = true に設定すると、スポナーを破壊できない場合にプレイヤーへメッセージが送信されます
CONFIG_SPAWNER_MESSAGE_DENYPLACE = true に設定すると、スポナーを設置できない場合にプレイヤーへメッセージが送信されます
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = true に設定すると、スポナーを変更できない場合にプレイヤーへメッセージが送信されます
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = true に設定すると、破壊されたスポナーを受け取るのに権限が不要になります
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = true に設定すると、スポナーの設置に権限が不要になります
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = true に設定すると、スポーンエッグでのスポナーの変更に権限が不要になります
CONFIG_UPDATE_CHECK_ENABLED = true に設定すると、プラグインがアップデートを確認します
CONFIG_UPDATE_CHECK_INTERVAL = アップデートを確認する間隔（時間）、最小1
CONFIG_HOOKS_SHOPGUIPLUS = true に設定すると、ShopGUI+ がインストールされている場合に SilkSpawners が連携します

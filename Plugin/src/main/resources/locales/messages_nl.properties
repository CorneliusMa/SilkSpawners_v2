CONFIG_MESSAGES_PREFIX = Het pluginvoorvoegsel dat wordt gebruikt in alle berichten
CONFIG_MESSAGES_LOCALE = Het te gebruiken taalbestand
CONFIG_SPAWNER_DROPCHANCE = Kans in procenten (0-100) dat de spawner drop bij het ontginnen
CONFIG_SPAWNER_DESTROYABLE = Indien ingesteld op false, kunnen spawners niet vernietigd worden zonder SilkTouch of zonder de rechten
CONFIG_SPAWNER_PICKAXEREQUIRED = Indien ingesteld op false, zullen spawners altijd droppen, ongeacht het gebruikte voorwerp om ze te ontginnen
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Indien ingesteld op false, zullen spawners droppen, zelfs als de gebruikte pikhouweel geen SilkTouch heeft
CONFIG_SPAWNER_SILKTOUCHLEVEL = Het minimale SilkTouch-niveau dat de pikhouweel nodig heeft om spawners te ontginnen, minimaal 1
CONFIG_SPAWNER_ITEM_NAME = De naam van het gedropte spawnervoorwerp, {entity} wordt vervangen door de mobnaam
CONFIG_SPAWNER_ITEM_COLOR = De kleur van de mobnaam in chatberichten
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Indien ingesteld op true, wordt een bericht naar de speler gestuurd als de spawner niet vernietigd kan worden
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Indien ingesteld op true, wordt een bericht naar de speler gestuurd als de spawner niet geplaatst kan worden
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Indien ingesteld op true, wordt een bericht naar de speler gestuurd als de spawner niet veranderd kan worden
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Indien ingesteld op true, is geen recht vereist om vernietigde spawners te ontvangen
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Indien ingesteld op true, is geen recht vereist om spawners te plaatsen
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Indien ingesteld op true, is geen recht vereist om spawners met eieren te veranderen
CONFIG_UPDATE_CHECK_ENABLED = Indien ingesteld op true, controleert de plugin op updates
CONFIG_UPDATE_CHECK_INTERVAL = Het interval in uren om op updates te controleren, minimaal 1
CONFIG_HOOKS_SHOPGUIPLUS = Indien ingesteld op true, koppelt SilkSpawners met ShopGUI+ als het geïnstalleerd is

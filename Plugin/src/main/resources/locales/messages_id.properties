CONFIG_MESSAGES_PREFIX = Awalan plugin yang digunakan dalam semua pesan
CONFIG_MESSAGES_LOCALE = Berkas lokal yang akan digunakan
CONFIG_SPAWNER_DROPCHANCE = Probabilitas dalam persen (0-100) bahwa spawner akan jatuh saat ditambang
CONFIG_SPAWNER_DESTROYABLE = Jika diatur ke false, spawner tidak dapat dihancurkan tanpa SilkTouch atau tanpa izin
CONFIG_SPAWNER_PICKAXEREQUIRED = Jika diatur ke false, spawner akan selalu jatuh terlepas dari benda yang digunakan untuk menambangnya
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Jika diatur ke false, spawner akan jatuh meskipun beliung yang digunakan tidak memiliki SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = Level SilkTouch minimum yang diperlukan beliung untuk menambang spawner, minimal 1
CONFIG_SPAWNER_ITEM_NAME = Nama benda spawner yang dijatuhkan, {entity} diganti dengan nama mob
CONFIG_SPAWNER_ITEM_COLOR = Warna nama mob dalam pesan obrolan
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Jika diatur ke true, pesan dikirim ke pemain jika spawner tidak dapat dihancurkan
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Jika diatur ke true, pesan dikirim ke pemain jika spawner tidak dapat diletakkan
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Jika diatur ke true, pesan dikirim ke pemain jika spawner tidak dapat diubah
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Jika diatur ke true, tidak diperlukan izin untuk menerima spawner yang dihancurkan
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Jika diatur ke true, tidak diperlukan izin untuk meletakkan spawner
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Jika diatur ke true, tidak diperlukan izin untuk mengubah spawner dengan telur
CONFIG_UPDATE_CHECK_ENABLED = Jika diatur ke true, plugin memeriksa pembaruan
CONFIG_UPDATE_CHECK_INTERVAL = Interval dalam jam untuk memeriksa pembaruan, minimal 1
CONFIG_HOOKS_SHOPGUIPLUS = Jika diatur ke true, SilkSpawners terhubung dengan ShopGUI+ jika terpasang

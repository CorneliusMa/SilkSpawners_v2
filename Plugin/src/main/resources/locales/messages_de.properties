COMMAND_SILKSPAWNERS_HELP_MESSAGE = $7Du kannst die folgenden Befehle benutzen\: \n{0}\nBenutze /silkspawners help <Befehl> für detaillierte Informationen
COMMAND_SILKSPAWNERS_HELP_MESSAGE_HELP = $7Benutze diesen Befehl um Informationen über die Befehle die du benutzen kannst anzuzeigen. \nVerwendung\: /silkspawners help [Befehl]
COMMAND_SILKSPAWNERS_HELP_COMMAND_NOT_FOUND = $7Der Befehl $c/silkspawners {0}$7 existiert nicht.
COMMAND_SILKSPAWNERS_HELP_MESSAGE_EXPLOSION = $7Benutze diesen Befehl, um Spawner-Explosionen für einen bestimmten Spieler vorübergehend zu aktivieren oder zu deaktivieren. \nNutzung\: /silkspawners explosion <enable/disable/setting> <player>
COMMAND_SILKSPAWNERS_HELP_MESSAGE_GIVE = $7Benutze diesen Befehl, um Spielern Spawner zu geben. \nVerwendung\: /silkspawners give <spieler> <entity> [anzahl]
COMMAND_SILKSPAWNERS_HELP_MESSAGE_SET = $7Benutze diesen Befehl um bereits platzierte Spawner zu verändern. \nBenutzung\: /silkspawners set <entity>
COMMAND_SILKSPAWNERS_HELP_MESSAGE_ENTITIES = $7Benutze diesen Befehl, um für Befehle und Berechtigungen verfügbare Entities anzuzeigen. \nVerwendung\: /silkspawners entities
COMMAND_SILKSPAWNERS_HELP_MESSAGE_VERSION = $7Benutze diesen Befehl, um das Plugin auf Updates zu prüfen. \nVerwendung\: /silkspawners version
COMMAND_SILKSPAWNERS_HELP_MESSAGE_LOCALE = $7Benutze diesen Befehl, um die aktuell verwendete Sprache anzuzeigen, die Sprachdateien neu zu laden und sie aus der .jar-Datei wiederherzustellen. Neue und überarbeitete Nachrichten werden beim Start automatisch übernommen, daher ist ein Wiederherstellen nur nötig, um eigene Änderungen zu verwerfen. \n$eAchtung\! Alle eigenen Änderungen gehen verloren, wenn sie nicht vorher gespeichert wurden\!$7\nVerwendung\: /silkspawners locale <setting/reload/restore>
COMMAND_SILKSPAWNERS_HELP_MESSAGE_CONFIG = $7Benutze diesen Befehl, um Einstellungen anzuzeigen und zu ändern, die beim Abbauen von Spawnern ausgelosten Explosionsstufen zu verwalten und die Konfiguration aus der config.yml-Datei neu zu laden. \nVerwendung\:\n/silkspawners config reload\n/silkspawners config get <einstellung>\n/silkspawners config set <einstellung> <wert>\n/silkspawners config explosion <list/add/remove>
COMMAND_SILKSPAWNERS_HELP_MESSAGE_DUMP = $7Benutze diesen Befehl, um einen Diagnosebericht hochzuladen, den du an Supportanfragen anhängen kannst. \nVerwendung\: /silkspawners dump
COMMAND_SILKSPAWNERS_HELP_MESSAGE_SETUP = $7Deaktiviert oder aktiviert die Berechtigungen für die Verwendung von Spawner, sodass jeder sie ohne ein Berechtigungs-Plugin zerstören und platzieren kann. \nVerwendung\: /silkspawners setup [confirm/revert]


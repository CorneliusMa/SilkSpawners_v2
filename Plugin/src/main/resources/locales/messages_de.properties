CONFIG_MESSAGES_PREFIX = Das Plugin Präfix für alle Nachrichten
CONFIG_MESSAGES_LOCALE = Die zu verwendende Sprachdatei
CONFIG_SPAWNER_DROPCHANCE = Wahrscheinlichkeit in Prozent (0-100), dass ein Spawner dropped, wenn er abgebaut wird
CONFIG_SPAWNER_DESTROYABLE = Wenn auf "false" gesetzt, können Spawner nicht ohne SilkTouch oder ohne Erlaubnis zerstört werden
CONFIG_SPAWNER_PICKAXEREQUIRED = Wenn auf "false" gesetzt, werden die Spawner immer droppen, unabhängig von dem Gegenstand, mit dem er abgebaut wurde
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Wenn auf "false" gesetzt, werden Spawner immer droppen, auch wenn die verwendete Spitzhacke keine SilkTouch hat
CONFIG_SPAWNER_SILKTOUCHLEVEL = Das minimale SilkTouch-Level, das die Spitzhacke benötigt, um Spawner abzubauen, mindestens 1
CONFIG_SPAWNER_ITEM_NAME = Der Name des Spawner-Gegenstands, {entity} wird durch den Mob-Namen ersetzt
CONFIG_SPAWNER_ITEM_COLOR = Die Farbe von Mob-Namen in Chat-Nachrichten
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Wenn auf "true" gesetzt, wird eine Nachricht an den Spieler gesendet, wenn er einen Spawner nicht zerstören kann
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Wenn auf "true" gesetzt, wird eine Nachricht an den Spieler gesendet, wenn er einen Spawner nicht platzieren kann
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Wenn auf "true" gesetzt, wird eine Nachricht an den Spieler gesendet, wenn er einen Spawner nicht ändern kann
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Wenn auf "true" gesetzt, ist keine Berechtigung erforderlich, damit zerstörte Spawner droppen
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Wenn auf "true" gesetzt, ist keine Berechtigung erforderlich, um Spawner zu platzieren
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Wenn auf "true" gesetzt, ist keine Berechtigung erforderlich, um Spawner mit Eiern zu ändern
CONFIG_UPDATE_CHECK_ENABLED = Wenn auf "true" gesetzt, prüft das Plugin auf Updates
CONFIG_UPDATE_CHECK_INTERVAL = Das Intervall in Stunden, in dem nach Updates gesucht werden soll, mindestens 1
CONFIG_HOOKS_SHOPGUIPLUS = Wenn auf "true" gesetzt, integriert sich SilkSpawners in ShopGUI+, wenn es installiert ist

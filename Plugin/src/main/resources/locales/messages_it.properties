CONFIG_SPAWNER_DESTROYABLE = Se impostato su false, gli spawner non possono essere distrutti senza SilkTouch o senza il permesso
CONFIG_SPAWNER_PICKAXEREQUIRED = Se impostato su false, gli spawner cadranno sempre indipendentemente dall'oggetto usato per minarli
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Se impostato su false, gli spawner cadranno anche se il piccone usato non ha SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = Il livello minimo di SilkTouch necessario al piccone per minare gli spawner, almeno 1
CONFIG_SPAWNER_ITEM_NAME = Il nome dell''oggetto spawner che cade, {entity} viene sostituito con il nome del mob
CONFIG_SPAWNER_ITEM_COLOR = Il colore del nome del mob nei messaggi in chat
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Se impostato su true, viene inviato un messaggio al giocatore se lo spawner non può essere distrutto
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Se impostato su true, viene inviato un messaggio al giocatore se lo spawner non può essere posizionato
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Se impostato su true, viene inviato un messaggio al giocatore se lo spawner non può essere modificato
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Se impostato su true, non è richiesto alcun permesso per ricevere spawner distrutti
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Se impostato su true, non è richiesto alcun permesso per posizionare gli spawner
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Se impostato su true, non è richiesto alcun permesso per modificare gli spawner con le uova
CONFIG_UPDATE_CHECK_ENABLED = Se impostato su true, il plugin controlla gli aggiornamenti
CONFIG_UPDATE_CHECK_INTERVAL = L'intervallo in ore per controllare gli aggiornamenti, almeno 1

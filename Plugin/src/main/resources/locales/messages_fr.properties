CONFIG_MESSAGES_PREFIX = Le préfixe du plugin utilisé dans tous les messages
CONFIG_MESSAGES_LOCALE = Le fichier de langue à utiliser
CONFIG_SPAWNER_DROPCHANCE = Probabilité en pourcentage (0-100) que le spawner tombe lorsqu'il est miné
CONFIG_SPAWNER_DESTROYABLE = Si défini sur false, les spawners ne peuvent pas être détruits sans SilkTouch ou sans la permission
CONFIG_SPAWNER_PICKAXEREQUIRED = Si défini sur false, les spawners tomberont toujours, quel que soit l'objet utilisé pour les miner
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Si défini sur false, les spawners tomberont même si la pioche utilisée n'a pas SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = Le niveau minimum de SilkTouch requis sur la pioche pour miner les spawners, au moins 1
CONFIG_SPAWNER_ITEM_NAME = Le nom de l''objet spawner obtenu, {entity} est remplacé par le nom du mob
CONFIG_SPAWNER_ITEM_COLOR = La couleur du nom du mob dans les messages du chat
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Si défini sur true, un message est envoyé au joueur si le spawner ne peut pas être détruit
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Si défini sur true, un message est envoyé au joueur si le spawner ne peut pas être placé
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Si défini sur true, un message est envoyé au joueur si le spawner ne peut pas être modifié
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Si défini sur true, aucune permission n'est requise pour recevoir les spawners détruits
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Si défini sur true, aucune permission n'est requise pour placer des spawners
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Si défini sur true, aucune permission n'est requise pour modifier les spawners avec des œufs
CONFIG_UPDATE_CHECK_ENABLED = Si défini sur true, le plugin vérifie les mises à jour
CONFIG_UPDATE_CHECK_INTERVAL = L'intervalle en heures entre chaque vérification des mises à jour, au moins 1
CONFIG_HOOKS_SHOPGUIPLUS = Si défini sur true, SilkSpawners s'intègre à ShopGUI+ s'il est installé

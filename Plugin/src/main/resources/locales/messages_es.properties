CONFIG_MESSAGES_PREFIX = El prefijo del plugin usado en todos los mensajes
CONFIG_MESSAGES_LOCALE = El archivo de idioma a usar
CONFIG_SPAWNER_DROPCHANCE = Probabilidad en porcentaje (0-100) de que el spawner caiga al ser minado
CONFIG_SPAWNER_DESTROYABLE = Si se establece en false, los spawners no pueden destruirse sin SilkTouch o sin el permiso
CONFIG_SPAWNER_PICKAXEREQUIRED = Si se establece en false, los spawners siempre caerán sin importar el objeto usado para minarlos
CONFIG_SPAWNER_SILKTOUCHREQUIRED = Si se establece en false, los spawners caerán incluso si el pico usado no tiene SilkTouch
CONFIG_SPAWNER_SILKTOUCHLEVEL = El nivel mínimo de SilkTouch que necesita el pico para minar spawners, al menos 1
CONFIG_SPAWNER_ITEM_NAME = El nombre del objeto spawner que cae, {entity} se reemplaza con el nombre del mob
CONFIG_SPAWNER_ITEM_COLOR = El color del nombre del mob en los mensajes de chat
CONFIG_SPAWNER_MESSAGE_DENYDESTROY = Si se establece en true, se envía un mensaje al jugador si el spawner no puede destruirse
CONFIG_SPAWNER_MESSAGE_DENYPLACE = Si se establece en true, se envía un mensaje al jugador si el spawner no puede colocarse
CONFIG_SPAWNER_MESSAGE_DENYCHANGE = Si se establece en true, se envía un mensaje al jugador si el spawner no puede cambiarse
CONFIG_SPAWNER_PERMISSION_DISABLEDESTROY = Si se establece en true, no se requiere permiso para recibir spawners destruidos
CONFIG_SPAWNER_PERMISSION_DISABLEPLACE = Si se establece en true, no se requiere permiso para colocar spawners
CONFIG_SPAWNER_PERMISSION_DISABLECHANGE = Si se establece en true, no se requiere permiso para cambiar spawners con huevos
CONFIG_UPDATE_CHECK_ENABLED = Si se establece en true, el plugin busca actualizaciones
CONFIG_UPDATE_CHECK_INTERVAL = El intervalo en horas para buscar actualizaciones, al menos 1
CONFIG_HOOKS_SHOPGUIPLUS = Si se establece en true, SilkSpawners se integra con ShopGUI+ si está instalado

name: Bug Report
description: Report something that is not working as expected
labels: ["bug", "triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I have checked the [FAQ](https://github.com/CorneliusMa/SilkSpawners_v2/blob/master/docs/FAQ.md) and searched [existing issues](https://github.com/CorneliusMa/SilkSpawners_v2/issues?q=is%3Aissue)
          required: true
        - label: I can reproduce the bug with the [latest release](https://github.com/CorneliusMa/SilkSpawners_v2/releases/latest)
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Place a spawner ...
        2. Mine it with ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: dump
    attributes:
      label: Diagnostic dump
      description: Run `/silkspawners dump` and paste the link it returns. It bundles your versions, config, plugin list and hooks into one report. If you provide this, you can leave the version, server, configuration and plugin fields below empty.
      placeholder: "https://..."
  - type: textarea
    id: logs
    attributes:
      label: Errors and log output
      description: Any related errors or log lines from the server console. Not included in the dump. This will be automatically formatted, no need for backticks.
      render: shell
  - type: markdown
    attributes:
      value: "The fields below are only needed if you could **not** run `/silkspawners dump` above."
  - type: input
    id: plugin-version
    attributes:
      label: SilkSpawners version
      description: Shown by `/silkspawners version`. Not needed if you attached a dump.
      placeholder: "3.0.0"
  - type: dropdown
    id: server-software
    attributes:
      label: Server software
      description: Not needed if you attached a dump.
      options:
        - Paper
        - Spigot
        - Purpur
        - Folia
        - Bukkit
        - Other (please mention in the description)
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Output of the `/version` command. Not needed if you attached a dump.
      placeholder: "1.21.8"
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `config.yml`, if it differs from the default. Not needed if you attached a dump. This will be automatically formatted, no need for backticks.
      render: yaml
  - type: input
    id: related-plugins
    attributes:
      label: Related plugins
      description: Other plugins involved, if the bug concerns an integration. Not needed if you attached a dump.
      placeholder: "ShopGUI+ 1.x, EconomyShopGUI 6.x"

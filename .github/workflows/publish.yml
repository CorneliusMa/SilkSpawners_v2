name: Publish

on:
  release:
    types: [ published ]
  workflow_call:
  workflow_dispatch:

jobs:

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: github.event_name == 'workflow_dispatch' && github.ref_name != 'release/next'
        run: |
          echo "::error::Previews are published from release/next only, got ${{ github.ref_name }}"
          exit 1

      # Full history: the locale signatures are generated from the released tags
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      # release/next already carries the version a merge would ship, so previews are
      # labelled against that instead of against the last release
      - id: beta
        if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease
        run: |
          version=$(sed -n 's/^[[:space:]]*pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-beta.*' origin/master)
          echo "version=$version-beta.$(git rev-list --count "$last..origin/master")" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse origin/master)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to Hangar
        run: ./gradlew :Publication:publishPluginPublicationToHangar --no-daemon --stacktrace
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_ID: ${{ secrets.HANGAR_ID }}
          PUBLISH_VERSIONS: ${{ vars.PUBLISH_VERSIONS }}
          HANGAR_PUBLISH_CHANNEL: ${{ (github.event_name == 'workflow_dispatch' || github.event.release.prerelease) && 'Preview' || 'Release' }}
          PUBLISH_BETA_VERSION: ${{ steps.beta.outputs.version }}

      - name: Publish to Modrinth
        run: ./gradlew :Publication:modrinth --no-daemon --stacktrace
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ secrets.MODRINTH_ID }}
          PUBLISH_VERSIONS: ${{ vars.PUBLISH_VERSIONS }}
          MODRINTH_PUBLISH_CHANNEL: ${{ (github.event_name == 'workflow_dispatch' || github.event.release.prerelease) && 'beta' || 'release' }}
          PUBLISH_BETA_VERSION: ${{ steps.beta.outputs.version }}

      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.beta.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then exit 0; fi
          git tag "$tag" '${{ steps.beta.outputs.commit }}'
          git push origin "refs/tags/$tag"

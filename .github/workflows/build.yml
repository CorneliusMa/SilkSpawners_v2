name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      # Full history: the locale signatures are generated from the released tags
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          path: |
            build/libs/SilkSpawners_v2.jar
            build/libs/SilkSpawners_v2-api-*.jar

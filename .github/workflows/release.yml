name: Release

on:
  push:
    tags:
      - '*'
      - '!api-*'
      - '!*-beta.*'
  workflow_call:
  workflow_dispatch:

jobs:

  build:
    uses: ./.github/workflows/build.yml

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: read
    outputs:
      already-published: ${{ steps.existing.outputs.published }}
      draft: ${{ steps.state.outputs.draft }}

    steps:

      # https://github.com/actions/checkout/issues/1471
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: artifact

      - id: tag
        run: echo "latest=$(git describe --tags --abbrev=0 --exclude 'api-*' --exclude '*-beta.*')" >> $GITHUB_OUTPUT

      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "published=$(gh release view '${{ steps.tag.outputs.latest }}' --json isDraft --jq '.isDraft == false' 2> /dev/null || echo false)" >> $GITHUB_OUTPUT

      # Release notes are whatever was written above the marker on the release
      # pull request, falling back to the commit subjects when it was left alone.
      # release/next is reused every release, so the title has to name this one.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.latest }}
        run: |
          : > "$RUNNER_TEMP/pr"
          if [ "$(gh pr list --head release/next --state merged --limit 1 --json title --jq '.[0].title // ""')" = "build: release version ${TAG#v}" ]; then
            gh pr list --head release/next --state merged --limit 1 --json body --jq '.[0].body // ""' > "$RUNNER_TEMP/pr"
          fi
          sed '/<!-- commits -->/,$d' "$RUNNER_TEMP/pr" > "$RUNNER_TEMP/notes"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes"; then
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-beta.*' HEAD^ 2> /dev/null || true)
            git log --no-merges --format='- %s' ${last:+$last..}HEAD | grep -E '^- (feat|fix|perf)' > "$RUNNER_TEMP/notes" || true
          fi

          {
            echo 'changes<<CHANGES_EOF'
            cat "$RUNNER_TEMP/notes"
            echo
            echo CHANGES_EOF
          } >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v3.0.1
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          name: ${{ steps.tag.outputs.latest }}
          tag_name: ${{ steps.tag.outputs.latest }}
          body: ${{ steps.changes.outputs.changes }}
          append_body: ${{ steps.existing.outputs.published == 'true' }}
          files: artifact/*

      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "draft=$(gh release view '${{ steps.tag.outputs.latest }}' --json isDraft --jq .isDraft)" >> $GITHUB_OUTPUT

  publish:
    if: github.event_name == 'push' && needs.release.outputs.already-published != 'true' && needs.release.outputs.draft == 'false'
    needs: release
    uses: ./.github/workflows/publish.yml
    secrets: inherit

name: Commit messages

on:
  pull_request:

permissions: {}

jobs:

  commitlint:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      # Reuses .githooks/commit-msg so the hook and CI can never disagree
      - run: |
          status=0
          for sha in $(git rev-list --no-merges '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! COMMIT_PATHS=$(git show --name-only --format= "$sha") .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              status=1
            fi
          done
          exit $status

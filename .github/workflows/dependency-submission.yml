name: Dependency submission

on:
  push:
    branches: [ master ]

permissions: {}

jobs:

  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # Full history: the locale signatures are generated from the released tags
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/dependency-submission@v6
